[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mvsec-benchmark"
version = "0.1.0"
description = "MVSEC optical-flow V9 benchmark for COMP5703"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "h5py>=3.10",
  "matplotlib>=3.8",
  "PyYAML>=6.0",
  "rosbags>=0.10",
  "torch>=2.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
